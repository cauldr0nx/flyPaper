[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flypaper"
version = "0.1.0"
description = "Novelty ranking for web fuzzing output, scored by the fruit fly olfactory circuit."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "flypaper contributors" }]
keywords = ["fuzzing", "ffuf", "novelty-detection", "connectomics", "flyhash"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15.0",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
fly = "flypaper.cli:main"

[project.urls]
Homepage = "https://github.com/cauldr0nx/flyPaper"
Source = "https://github.com/cauldr0nx/flyPaper"
Issues = "https://github.com/cauldr0nx/flyPaper/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["flypaper"]

[tool.pytest.ini_options]
testpaths = ["tests", "bench"]
# Tests that need the downloaded MaleCNS tables are marked `data` and are deselected by
# default so the suite stays offline and dataset-free.
addopts = "-m 'not data' -q"
markers = [
    "data: requires the downloaded MaleCNS flat-connectome tables (see data/fetch.py)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
